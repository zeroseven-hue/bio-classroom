<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>701 班級萬用賀喜機</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--ink:#4b2d20;--red:#b7352b;--red2:#8f261f;--gold:#e6b64d;--cream:#fff8e8;--paper:#fffdf7;--muted:#8b735f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,#fff9df 0,#faedc9 36%,#efcf99 100%);overflow-x:hidden}
button,input,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:18px;max-width:1180px;margin:auto}.top{text-align:center}.eyebrow{display:inline-block;background:var(--red);color:#fff7d6;border-radius:999px;padding:6px 16px;font-weight:900;letter-spacing:.08em}.top h1{font-size:clamp(30px,5vw,58px);margin:8px 0 2px;line-height:1;color:#6f241e}.top p{margin:8px 0;color:#76513c;font-weight:700}.shell{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.72fr);gap:16px}.stage,.panel{background:rgba(255,253,247,.93);border:2px solid #e7bd69;border-radius:28px;box-shadow:0 18px 45px #8f5f3424}.stage{position:relative;min-height:610px;overflow:hidden;display:flex;flex-direction:column;padding:18px}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,#ffe9a8aa,transparent 38%),linear-gradient(90deg,#a72f280c 0 12%,transparent 12% 88%,#a72f280c 88%);pointer-events:none}.status{z-index:2;display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{background:#fff3cf;border:1px solid #e9c36c;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:900}.level{background:#8f261f;color:#fff3bd;border-radius:999px;padding:7px 12px;font-weight:900;display:none}.headline{z-index:2;text-align:center;min-height:104px;padding:12px 10px 0}.headline h2{font-size:clamp(27px,4vw,48px);line-height:1.12;margin:0;color:var(--red2);font-weight:1000}.headline p{font-size:clamp(16px,2vw,23px);margin:8px 0;color:#79503a;font-weight:900}.arena{z-index:2;position:relative;flex:1;min-height:390px;border-radius:22px;border:2px dashed #e7bf6b;background:linear-gradient(#fffaf0aa,#f9e7b6aa);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:18px 12px 28px}.floor{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(#d9a955,#b77d33)}.idle{align-self:center;text-align:center;margin:auto;font-weight:900;color:#8b603d}.idle .cup{font-size:92px;animation:float 1.4s ease-in-out infinite}.cast{width:100%;height:100%;display:none;align-items:flex-end;justify-content:center;gap:clamp(2px,2vw,18px);position:relative}.person{width:clamp(92px,17%,145px);aspect-ratio:.78;position:relative;animation:hop .72s ease-in-out infinite;filter:drop-shadow(0 10px 7px #6f4a2530)}.person:nth-child(2){animation-delay:.12s}.person:nth-child(3){animation-delay:.24s}.person:nth-child(4){animation-delay:.36s}.person:nth-child(5){animation-delay:.48s}.head{position:absolute;width:68%;aspect-ratio:1;left:16%;top:10%;border-radius:48% 48% 44% 44%;background:#ffd8ae;border:4px solid #4b3028;z-index:3}.hair{position:absolute;width:72%;height:35%;left:14%;top:5%;background:#49322b;border-radius:50% 50% 35% 35%;z-index:4}.eye{position:absolute;top:47%;width:15%;height:7%;border-top:4px solid #4b3028;border-radius:50%;z-index:5}.eye.l{left:25%;transform:rotate(10deg)}.eye.r{right:25%;transform:rotate(-10deg)}.mouth{position:absolute;left:39%;top:65%;width:22%;height:16%;background:#a92f32;border-radius:4px 4px 50% 50%;z-index:5}.blush{position:absolute;top:59%;width:13%;aspect-ratio:1;background:#ef8d83;border-radius:50%;opacity:.55;z-index:5}.blush.l{left:12%}.blush.r{right:12%}.body{position:absolute;width:76%;height:48%;left:12%;bottom:0;background:var(--shirt,#b7352b);border:4px solid #4b3028;border-bottom:0;border-radius:38% 38% 12% 12%;z-index:2}.arm{position:absolute;width:20%;height:43%;top:44%;background:#ffd8ae;border:4px solid #4b3028;border-radius:999px;transform-origin:bottom center;z-index:1}.arm.l{left:2%;transform:rotate(34deg)}.arm.r{right:2%;transform:rotate(-34deg)}.prop{position:absolute;left:50%;top:-8%;transform:translateX(-50%) rotate(-4deg);z-index:8;background:#ffe9a3;border:3px solid #a66c20;border-radius:12px;padding:5px 8px;font-weight:1000;font-size:clamp(10px,1.4vw,15px);white-space:nowrap}.crown{position:absolute;left:50%;top:-4%;transform:translateX(-50%);font-size:34px;z-index:8}.extras{position:absolute;inset:5px 10px auto;display:flex;justify-content:space-around;font-size:clamp(25px,4vw,42px);opacity:.88}.banner{z-index:3;margin-top:12px;background:linear-gradient(90deg,#992a23,#c43c31,#992a23);color:#fff1a8;border:2px solid #e7bd55;border-radius:18px;text-align:center;font-size:clamp(22px,3vw,36px);font-weight:1000;padding:10px;display:none;animation:pop .38s cubic-bezier(.2,.9,.25,1.3)}.panel{padding:18px;display:flex;flex-direction:column;gap:14px}.panel h3{font-size:22px;margin:0;color:#70241e}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f6e5bd;border-radius:14px;padding:4px}.tab{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:900;color:#79543b;cursor:pointer}.tab.active{background:#fff;color:#922d25;box-shadow:0 3px 12px #7f532522}.box{background:#fff9ea;border:1px solid #e8c77f;border-radius:18px;padding:13px}.box label{display:block;font-weight:900;margin-bottom:6px}.box input,.box textarea{width:100%;border:1.5px solid #d8b66e;border-radius:12px;padding:10px 11px;background:#fff;font-weight:700;color:#51372c;outline:none}.box textarea{min-height:72px;resize:vertical}.custom{display:none;gap:10px;flex-direction:column}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.lvl{border:2px solid #d6a64d;background:#fff4cf;color:#713b20;border-radius:14px;padding:9px 3px;font-weight:1000;cursor:pointer;transition:.15s}.lvl:hover,.lvl.selected{transform:translateY(-2px);background:#b7352b;color:#fff6c9;border-color:#8e271f}.start{border:0;border-radius:17px;background:linear-gradient(#c84437,#9f2c25);color:#fff3bd;padding:14px;font-size:20px;font-weight:1000;cursor:pointer;box-shadow:0 8px 0 #76231e}.start:active{transform:translateY(5px);box-shadow:0 3px 0 #76231e}.stop{border:1px solid #caa866;background:#fff;color:#76533e;border-radius:13px;padding:10px;font-weight:900;cursor:pointer}.hint{font-size:13px;color:#8a6a52;line-height:1.55}.footer{text-align:center;color:#7c583f;font-size:13px;font-weight:800}.shake{animation:shake .32s linear 2}@keyframes hop{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-28px) rotate(1deg)}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.stage{min-height:560px}.panel{order:-1}.app{padding:10px}.person{width:18%}.headline{min-height:90px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>

  <!-- 🔒 學生派發模式自動隱藏返回大廳按鈕 -->
  <script>
    if (window.location.search.includes('dispatch=true')) {
      document.documentElement.classList.add('dispatch-mode');
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('a[href*="index.html"], .btn-back').forEach(function(el) {
          el.style.display = 'none';
        });
      });
    }
  </script>
  <style>
    html.dispatch-mode a[href*="index.html"],
    html.dispatch-mode .btn-back {
      display: none !important;
    }
  </style>

</head>
<body>
<div class="app">
<header class="top"><a href="../index.html" class="tab" style="background:#475569;color:#fff;text-decoration:none;padding:6px 14px;border-radius:8px;font-weight:bold;margin-bottom:8px;display:inline-block">⬅️ 返回大廳四 (導師神器)</a><br><span class="eyebrow">✨ 喜事速報 ✨</span><h1>班級萬用賀喜機</h1><p>今天值得慶祝的事，就讓它隆重一點！</p></header>
<div class="shell">
<section class="stage" id="stage">
  <div class="status"><div class="badge" id="statusText">準備就緒・選擇慶祝強度</div><div class="level" id="levelBadge">賀喜 LEVEL 1</div></div>
  <div class="headline"><h2 id="mainTitle">701 又得獎啦！</h2><p id="subTitle">秩序、整潔、比賽、進步、背書過關……通通都能慶祝。</p></div>
  <div class="arena">
    <div class="extras" id="extras" style="display:none"><span>🎊</span><span>🙌</span><span>🎺</span><span>👏</span><span>🥳</span></div>
    <div class="idle" id="idle"><div class="cup">🏆</div><div style="font-size:22px">今天要賀喜誰呢？</div><div style="font-size:14px;margin-top:6px;color:#9a7657">右邊選好後，按下「開始賀喜」</div></div>
    <div class="cast" id="cast"></div><div class="floor"></div>
  </div>
  <div class="banner" id="banner">🎉 恭喜老爺！賀喜夫人！ 🎉</div>
</section>
<aside class="panel">
  <h3>🎛️ 慶祝控制台</h3>
  <div class="tabs"><button class="tab active" id="quickTab">⚡ 快速賀喜</button><button class="tab" id="customTab">✏️ 自訂賀喜</button></div>
  <div class="box" id="quickBox"><label>快速選擇</label><div class="hint">不輸入資料，直接用「701 又得獎啦！」開始慶祝。</div></div>
  <div class="custom" id="customBox">
    <div class="box"><label for="who">慶祝對象</label><input id="who" maxlength="18" placeholder="例如：王小明、701全班" /></div>
    <div class="box"><label for="event">值得慶祝的事</label><textarea id="event" maxlength="45" placeholder="例如：校慶100公尺第一名、背書全數過關、段考進步……"></textarea></div>
  </div>
  <div class="box"><label>要多誇張地慶祝？</label><div class="levels" id="levels"><button class="lvl selected" data-level="1">1</button><button class="lvl" data-level="2">2</button><button class="lvl" data-level="3">3</button><button class="lvl" data-level="4">4</button><button class="lvl" data-level="5">5</button></div><div class="hint" style="margin-top:8px">1 = 小賀喜　｜　5 = 全場失控 🤣</div></div>
  <button class="start" id="startBtn">🎉 開始賀喜！</button><button class="stop" id="stopBtn">⏹ 停止／回到準備畫面</button>
  <div class="hint">🔊 會使用瀏覽器中文語音。不同電腦的聲音可能略有不同；若第一次沒有聲音，再按一次即可。</div>
</aside>
</div>
<footer class="footer">🏆 有進步就值得被看見・有好消息就值得好好慶祝</footer>
</div>
<script>
const $=s=>document.querySelector(s);let mode='quick',selectedLevel=1,running=false,cancelled=false,timers=[];
const shirts=['#b7352b','#287c78','#d7922d','#7357a6','#35754b'];
function person(i,level){const prop=['賀！','好棒！','第一名！','太強啦！','全班喝采！'][i];return `<div class="person" style="--shirt:${shirts[i]}">${level>=5&&i===2?'<div class="crown">👑</div>':''}<div class="prop">${prop}</div><div class="hair"></div><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="blush l"></i><i class="blush r"></i><i class="mouth"></i></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div></div>`}
function setMode(m){mode=m;$('#quickTab').classList.toggle('active',m==='quick');$('#customTab').classList.toggle('active',m==='custom');$('#customBox').style.display=m==='custom'?'flex':'none';$('#quickBox').style.display=m==='quick'?'block':'none'}
$('#quickTab').onclick=()=>setMode('quick');$('#customTab').onclick=()=>setMode('custom');
$('#levels').onclick=e=>{const b=e.target.closest('.lvl');if(!b)return;selectedLevel=+b.dataset.level;document.querySelectorAll('.lvl').forEach(x=>x.classList.toggle('selected',x===b))};
function wait(ms){return new Promise(r=>{const id=setTimeout(r,ms);timers.push(id)})}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function fanfare(level){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const notes=[392,523.25,659.25,783.99];if(level>=3)notes.push(1046.5);notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=level>=4?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,ctx.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.1+.35);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.1);o.stop(ctx.currentTime+i*.1+.4)});setTimeout(()=>ctx.close(),1600)}catch(e){}}
function confettiGo(level){if(typeof confetti!=='function')return;const count=45+level*24;confetti({particleCount:count,spread:55+level*12,origin:{y:.68}});if(level>=3){setTimeout(()=>confetti({particleCount:55,angle:60,spread:65,origin:{x:.08,y:.72}}),180);setTimeout(()=>confetti({particleCount:55,angle:120,spread:65,origin:{x:.92,y:.72}}),180)}if(level===5)setTimeout(()=>confetti({particleCount:130,spread:120,origin:{y:.45}}),450)}
function speak(text,round=0){return new Promise(resolve=>{
  if(!('speechSynthesis'in window)){setTimeout(resolve,1200);return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';
  const rates=[0.96,0.96,1.04,1.12,1.20,1.22];
  const pitches=[1.02,1.02,1.08,1.14,1.20,1.24];
  u.rate=rates[Math.min(round,5)];
  u.pitch=pitches[Math.min(round,5)];
  let done=false;
  const finish=()=>{if(done)return;done=true;clearTimeout(safety);resolve()};
  u.onend=finish;u.onerror=finish;
  speechSynthesis.speak(u);
  const safety=setTimeout(finish,Math.max(8000,text.length*450));
})}
function getContent(){if(mode==='custom'){const who=$('#who').value.trim()||'701同學';const event=$('#event').value.trim()||'今天表現超級棒';return{title:`恭喜 ${who}！`,sub:event,intro:`恭喜${who}！${event}！`}}return{title:'701 又得獎啦！',sub:'今天的努力有被看見，值得全班一起慶祝！',intro:'七零一又得獎啦！'}}
function showRound(round,total){$('#idle').style.display='none';$('#cast').style.display='flex';$('#cast').innerHTML=Array.from({length:round},(_,i)=>person(i,round)).join('');$('#extras').style.display=round>=4?'flex':'none';$('#levelBadge').style.display='block';$('#levelBadge').textContent=`賀喜 ${round} / ${total}`;$('#statusText').textContent=round===5?'第五喜・全場失控！':`第 ${round} 喜・賀喜團登場！`;$('#banner').style.display='block';$('#banner').classList.remove('shake');void $('#banner').offsetWidth;if(round>=4)$('#banner').classList.add('shake')}
async function start(){if(running)return;running=true;cancelled=false;clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();const c=getContent();$('#mainTitle').textContent=c.title;$('#subTitle').textContent=c.sub;$('#startBtn').disabled=true;await speak(c.intro,0);if(!cancelled)await wait(260);for(let r=1;r<=selectedLevel;r++){if(cancelled)break;showRound(r,selectedLevel);fanfare(r);confettiGo(r);const praise=r===5?'恭喜老爺！賀喜夫人！':'恭喜老爺，賀喜夫人！';await speak(praise,r);if(r<selectedLevel&&!cancelled)await wait(r>=4?180:320)}if(!cancelled){$('#statusText').textContent=`🎉 賀喜完畢！LEVEL ${selectedLevel} 慶祝成功！`;if(selectedLevel===5){fanfare(5);confettiGo(5);setTimeout(()=>confettiGo(5),350)}}running=false;$('#startBtn').disabled=false}
function reset(){cancelled=true;running=false;clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();$('#startBtn').disabled=false;$('#cast').style.display='none';$('#cast').innerHTML='';$('#extras').style.display='none';$('#idle').style.display='block';$('#banner').style.display='none';$('#levelBadge').style.display='none';$('#statusText').textContent='準備就緒・選擇慶祝強度';$('#mainTitle').textContent='701 又得獎啦！';$('#subTitle').textContent='秩序、整潔、比賽、進步、背書過關……通通都能慶祝。'}
$('#startBtn').onclick=start;$('#stopBtn').onclick=reset;
</script>
</body></html>
